apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: tax-calculator-pipeline-run
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: "https://github.com/<YOUR_GITHUB_USERNAME>/tax-calculator.git"
    - name: branch
      value: "main"
    - name: image-name
      value: "us.icr.io/<YOUR_REGISTRY_NAMESPACE>/tax-calculator:latest"
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
